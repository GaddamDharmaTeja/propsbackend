spring.application.name=prospr-backend
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# MongoDB (Render: set SPRING_DATA_MONGODB_URI or mongodb.uri)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${mongodb.uri}}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:${mongodb.database:props}}

prospr.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-32-character-minimum}
prospr.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.error.include-message=always
